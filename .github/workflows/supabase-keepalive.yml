# =============================================================================
# SUPERSEDED (August 2026) - this workflow is NOT the active keepalive.
#
#   The live keepalive is a Vercel Cron job: see dashboard/api/keepalive.py
#   and the "crons" block in dashboard/vercel.json. It runs daily and belongs
#   to the Vercel project rather than to a GitHub user account.
#
#   This file is kept because the KNOWN TRAP note below documents a real
#   failure mode, and a revived schedule would only add a harmless extra
#   ping. It has not fired on schedule since 16 July 2026. Do not rely on it.
# =============================================================================
name: Supabase Keepalive

# Supabase free-tier pauses a project after ~7 days without database
# activity. This runs a real SQL query twice a week so the project
# stays warm.
#
# v2: pings via psql + the pooler connection string instead of the
# REST API. The REST version never went green (secret/env mix-ups,
# opaque 4xx). A direct SQL query has exactly one failure mode
# (bad connection string), is unambiguous "database activity" to
# the pause detector, and shares its secret with the backup
# workflow — one secret to maintain:
#
#   SUPABASE_DB_URL = Session pooler URI from Supabase Dashboard →
#     Connect → Session pooler, with [YOUR-PASSWORD] filled in.
#     (Same secret the Supabase Backup workflow uses.)
#
# The old SUPABASE_URL / SUPABASE_ANON_KEY secrets are no longer
# used by anything and can be deleted.

# KNOWN TRAP - the schedule can stop silently:
# GitHub ties a cron schedule to the account that last committed to
# this file. If that account loses access (removed from the org) or
# the repo is transferred, the schedule quietly stops firing while
# the workflow still shows as "active". This happened in July 2026
# after the ownership handover: no scheduled run fired for over a
# week and GitHub sent no warning, because nothing FAILED - the runs
# simply never started.
#
# How to spot it: in the Actions tab, check the trigger of recent
# runs. Only ever seeing "workflow_dispatch" means the schedule is
# dead. A green manual run is NOT proof the schedule works.
#
# How to fix it: commit any change to this file from an account that
# currently has write access. That re-registers the cron.

on:
  schedule:
    # Mon + Thu 12:00 UTC — two pings well inside the 7-day window.
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping database (select count(*) from profiles)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret not set. Add the Session pooler URI (Supabase Dashboard → Connect → Session pooler) in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip stray CR/LF from copy-paste; catch the classic
          # "[YOUR-PASSWORD] brackets left in" mistake with a clear
          # error instead of a cryptic auth failure.
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\r'/}"
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\n'/}"
          if [[ "$SUPABASE_DB_URL" == *"["* || "$SUPABASE_DB_URL" == *"]"* ]]; then
            echo "::error::SUPABASE_DB_URL contains [ or ] — replace [YOUR-PASSWORD] (brackets included) with the actual password, e.g. ...postgres.ref:MyPass123@aws-0-..."
            exit 1
          fi
          # psql ships preinstalled on the runner; a plain query works
          # across server major versions (only pg_dump is version-picky).
          psql "$SUPABASE_DB_URL" \
            --no-psqlrc --tuples-only \
            -c "select 'keepalive ok — ' || count(*) || ' profiles' from public.profiles;"
          echo "Keepalive OK — Supabase project pinged."
