name: Supabase Backup

# Weekly pg_dump of the whole database, stored as a GitHub Actions
# artifact. Free-tier Supabase has NO point-in-time recovery — if a
# bad migration or delete lands, this is the only undo. Same
# philosophy as the keepalive workflow: GitHub Actions so it runs
# independent of Vercel/deploy state, costs nothing at this scale.
#
# Setup once — add ONE repo secret (Settings → Secrets and variables
# → Actions):
#   SUPABASE_DB_URL = the "Session pooler" connection string from
#     Supabase Dashboard → Connect → Session pooler, with [YOUR-PASSWORD]
#     replaced by the real database password. Looks like:
#     postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#     (Use the Session pooler URI, not the direct connection — the
#     direct host is IPv6-only on free tier and GitHub runners are IPv4.)
#
# Restore procedure (if the day ever comes):
#   1. Download the artifact from the Actions run → unzip → gunzip
#   2. psql "<connection-string>" -f recast-backup-YYYY-MM-DD.sql
#      against a FRESH project, or selectively copy the tables you
#      need. Do a dry read of the file first — it's plain SQL.
#
# Retention: 90 days of weekly snapshots (GitHub artifact maximum).

# KNOWN TRAP - the schedule can stop silently:
# GitHub ties a cron schedule to the account that last committed to
# this file. If that account loses access (removed from the org) or
# the repo is transferred, the schedule quietly stops firing while
# the workflow still shows as "active". This happened in July 2026
# after the ownership handover: no scheduled run fired for over a
# week and GitHub sent no warning, because nothing FAILED - the runs
# simply never started.
#
# How to spot it: in the Actions tab, check the trigger of recent
# runs. Only ever seeing "workflow_dispatch" means the schedule is
# dead. A green manual run is NOT proof the schedule works.
#
# How to fix it: commit any change to this file from an account that
# currently has write access. That re-registers the cron.

on:
  schedule:
    # Sundays 03:00 UTC — quiet hours, after the week's data entry.
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install postgresql-client 17 (matches Supabase server major)
        run: |
          set -euo pipefail
          # PGDG's official setup script — non-interactive, handles the
          # signing key itself. (A hand-rolled curl|gpg pipeline here
          # previously died in CI: gpg tried to open /dev/tty, which
          # runners don't have.)
          sudo apt-get -qq update
          sudo apt-get -qq install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -qq install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret not set. Add the Session pooler URI in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip stray CR/LF from copy-paste; catch the classic
          # "[YOUR-PASSWORD] brackets left in" mistake with a clear
          # error instead of a cryptic auth failure.
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\r'/}"
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\n'/}"
          if [[ "$SUPABASE_DB_URL" == *"["* || "$SUPABASE_DB_URL" == *"]"* ]]; then
            echo "::error::SUPABASE_DB_URL contains [ or ] — replace [YOUR-PASSWORD] (brackets included) with the actual password, e.g. ...postgres.ref:MyPass123@aws-0-..."
            exit 1
          fi
          STAMP=$(date -u +%F)
          # Plain-SQL dump of the data schemas. --no-owner/--no-privileges
          # so the file restores cleanly into any project. auth + storage
          # schemas are Supabase-managed; public carries all app data.
          # (auth.users is included so logins are recoverable too.)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=auth \
            --format=plain \
            | gzip -9 > "recast-backup-${STAMP}.sql.gz"
          ls -lh recast-backup-*.sql.gz
          # Sanity floor: a real dump of this DB is far bigger than 10KB.
          SIZE=$(stat -c%s recast-backup-${STAMP}.sql.gz)
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Dump suspiciously small (${SIZE} bytes) — check the connection string / permissions."
            exit 1
          fi

      - name: Upload artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: recast-db-backup
          path: recast-backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
