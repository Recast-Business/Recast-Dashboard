# =============================================================================
# STILL IN USE - but its SCHEDULE is not.
#
#   This workflow still does the actual backup and is the only thing that
#   produces a restorable dump. What cannot be trusted is the `cron:` below:
#   it has not fired since 12 July 2026, leaving the product database with no
#   backups for over five weeks before this was caught.
#
#   It is now triggered daily by Vercel Cron instead, which calls
#   dashboard/api/trigger_backup.py, which dispatches this workflow via the
#   GitHub API. Manual dispatch has always worked; only the schedule was
#   broken. The cron line is left in place in case GitHub's scheduler ever
#   recovers, in which case it simply produces one extra backup.
# =============================================================================
name: Supabase Backup

# Weekly pg_dump of the whole database, stored as a GitHub Actions
# artifact. Free-tier Supabase has NO point-in-time recovery — if a
# bad migration or delete lands, this is the only undo. Same
# philosophy as the keepalive workflow: GitHub Actions so it runs
# independent of Vercel/deploy state, costs nothing at this scale.
#
# Setup once — add ONE repo secret (Settings → Secrets and variables
# → Actions):
#   SUPABASE_DB_URL = the "Session pooler" connection string from
#     Supabase Dashboard → Connect → Session pooler, with [YOUR-PASSWORD]
#     replaced by the real database password. Looks like:
#     postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#     (Use the Session pooler URI, not the direct connection — the
#     direct host is IPv6-only on free tier and GitHub runners are IPv4.)
#
# Restore procedure (if the day ever comes):
#   1. Download the artifact from the Actions run → unzip → gunzip
#   2. psql "<connection-string>" -f recast-backup-YYYY-MM-DD.sql
#      against a FRESH project, or selectively copy the tables you
#      need. Do a dry read of the file first — it's plain SQL.
#
# Retention: 90 days of weekly snapshots (GitHub artifact maximum).

# KNOWN TRAP - the schedule can stop silently:
# GitHub ties a cron schedule to the account that last committed to
# this file. If that account loses access (removed from the org) or
# the repo is transferred, the schedule quietly stops firing while
# the workflow still shows as "active". This happened in July 2026
# after the ownership handover: no scheduled run fired for over a
# week and GitHub sent no warning, because nothing FAILED - the runs
# simply never started.
#
# How to spot it: in the Actions tab, check the trigger of recent
# runs. Only ever seeing "workflow_dispatch" means the schedule is
# dead. A green manual run is NOT proof the schedule works.
#
# How to fix it: commit any change to this file from an account that
# currently has write access. That re-registers the cron.

on:
  schedule:
    # Sundays 03:00 UTC — quiet hours, after the week's data entry.
    - cron: "0 3 * * 0"
  workflow_dispatch:

env:
  # Must match the Supabase server major version (currently 17). pg_dump
  # refuses to dump from a server newer than itself.
  PG_IMAGE: postgres:17-alpine

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pg_dump comes from the official Postgres image rather than from apt.
      #
      # The apt route installed postgresql-client-17 from the PGDG repository
      # on every single run, which meant every run depended on three package
      # mirrors being reachable and fast. On 19 August 2026 the Azure Ubuntu
      # mirror stopped responding, apt sat through its retry timeouts, and the
      # job burned all 15 minutes of its budget without ever reaching pg_dump.
      # A backup that only works when three mirrors cooperate is not a backup.
      #
      # Pulling a pinned image is one fetch from one registry, it takes
      # seconds, and it gives the exact pg_dump major version every time.
      - name: Fetch pg_dump 17
        run: |
          set -euo pipefail
          docker pull -q "$PG_IMAGE"
          docker run --rm "$PG_IMAGE" pg_dump --version

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret not set. Add the Session pooler URI in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Strip stray CR/LF from copy-paste; catch the classic
          # "[YOUR-PASSWORD] brackets left in" mistake with a clear
          # error instead of a cryptic auth failure.
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\r'/}"
          SUPABASE_DB_URL="${SUPABASE_DB_URL//$'\n'/}"
          if [[ "$SUPABASE_DB_URL" == *"["* || "$SUPABASE_DB_URL" == *"]"* ]]; then
            echo "::error::SUPABASE_DB_URL contains [ or ] — replace [YOUR-PASSWORD] (brackets included) with the actual password, e.g. ...postgres.ref:MyPass123@aws-0-..."
            exit 1
          fi
          STAMP=$(date -u +%F)
          # Plain-SQL dump of the data schemas. --no-owner/--no-privileges
          # so the file restores cleanly into any project. auth + storage
          # schemas are Supabase-managed; public carries all app data.
          # (auth.users is included so logins are recoverable too.)
          # -e forwards the value from this shell's environment rather than
          # placing it on the docker command line, keeping the password out
          # of the process list. Single quotes stop the outer shell expanding
          # it; the container's shell does that instead.
          export SUPABASE_DB_URL
          docker run --rm -e SUPABASE_DB_URL "$PG_IMAGE" \
            sh -c 'pg_dump "$SUPABASE_DB_URL" \
              --no-owner --no-privileges \
              --schema=public --schema=auth \
              --format=plain' \
            | gzip -9 > "recast-backup-${STAMP}.sql.gz"
          ls -lh recast-backup-*.sql.gz
          # Sanity floor: a real dump of this DB is far bigger than 10KB.
          SIZE=$(stat -c%s recast-backup-${STAMP}.sql.gz)
          if [ "$SIZE" -lt 10240 ]; then
            echo "::error::Dump suspiciously small (${SIZE} bytes) — check the connection string / permissions."
            exit 1
          fi

      - name: Upload artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: recast-db-backup
          path: recast-backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error

      # ───────────────────────────────────────────────────────────────────
      # Report the real outcome to the external monitor.
      #
      # The dispatcher (api/trigger_backup.py) only knows whether GitHub
      # ACCEPTED the request. It has no idea whether the dump succeeded, so
      # it must not be the thing that reports health: on 19 August 2026 the
      # dispatch was accepted and the backup then died, which under that
      # arrangement would have looked entirely healthy.
      #
      # Ownership of the "ok" signal therefore sits here, at the only point
      # that knows a restorable file actually exists. Three cases are then
      # covered: the dump fails and this reports it, the workflow never runs
      # at all and the monitor's own grace period catches the silence, and
      # the dispatch itself fails and the dispatcher reports that.
      #
      # Optional. With no HEALTHCHECK_URL_BACKUP secret these steps are
      # skipped and the backup is unaffected.
      # ───────────────────────────────────────────────────────────────────
      # The `secrets` context is not available in a step-level `if:`, so the
      # "is it configured" test is a shell check inside the step instead.
      - name: Report success to the monitor
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_BACKUP }}
        run: |
          set -euo pipefail
          if [ -z "${HC_URL:-}" ]; then
            echo "HEALTHCHECK_URL_BACKUP is not set, skipping the heartbeat."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 \
            --data-raw "Backup uploaded: $(ls recast-backup-*.sql.gz)" \
            "${HC_URL%/}" > /dev/null

      - name: Report failure to the monitor
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL_BACKUP }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${HC_URL:-}" ]; then
            echo "HEALTHCHECK_URL_BACKUP is not set, skipping the heartbeat."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 \
            --data-raw "Backup FAILED. See ${RUN_URL}" \
            "${HC_URL%/}/fail" > /dev/null
